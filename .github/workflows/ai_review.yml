name: AI Review & Auto-merge
on:
  push:
    branches: [testing]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}      # ← use your PAT, not the default GITHUB_TOKEN
          submodules: recursive

      # … your install & AI-review steps …

      - name: Merge to production if PASS
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}     # make it available to the script
        run: |
          # configure author
          git config --global user.name  "ai-bot"
          git config --global user.email "bot@example.com"

          # ensure origin uses the PAT
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git

          # merge & push
          git checkout production 
          git merge --no-ff $GITHUB_SHA -m "Auto-merge: $GITHUB_SHA"
          git push origin production
