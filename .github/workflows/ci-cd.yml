name: Build and publish images

on:
  push:
    branches: [Production]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/build-ai
  TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: lada
            file: compose/lada.Dockerfile
            context: .
            platforms: linux/amd64
          - name: giant-core
            file: compose/giant-core.Dockerfile
            context: .
            platforms: linux/amd64
          - name: giant-ui
            file: compose/giant-ui.Dockerfile
            context: .
            platforms: linux/amd64

          - name: lada-arm
            file: compose/lada-arm.Dockerfile
            context: .
            platforms: linux/arm64
          - name: giant-ui-arm
            file: compose/giant-ui-arm.Dockerfile
            context: .
            platforms: linux/arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: docker/setup-buildx-action@v3   

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6         
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ env.IMAGE_PREFIX }}:${{ matrix.name }}-${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}:${{ matrix.name }}-latest

